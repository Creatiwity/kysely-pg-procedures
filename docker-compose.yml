services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kysely_test
      POSTGRES_PASSWORD: kysely_test
      POSTGRES_DB: kysely_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kysely_test"]
      interval: 5s
      timeout: 5s
      retries: 5
